# Loupe's built-in bot directory. Compiled into the binary; site policy
# (allow / standard / block per category or bot) and custom bots live in the
# separate policy file the dashboard edits (bots.policy_file).
#
# Verification — a request only counts as a bot when its User-Agent contains
# one of the bot's ua tokens AND its IP passes at least one check:
#   ranges: named sources below — official IP lists the operator publishes,
#           fetched and cached by Loupe, refreshed daily
#   ptr:    reverse DNS must end in one of these suffixes and resolve back
#   asn:    the IP's network (from the GeoLite2 ASN database) must be one of
#           these — used for operators that crawl only from their own network
# A bot with none of these can never be allowed (a header alone is not proof);
# it can only be left to standard protection or blocked.
#
# ua tokens match case-insensitively; the longest matching token wins, so
# "Perplexity-User" never gets mistaken for "PerplexityBot".
#
# robots: the bot's robots.txt user-agent tokens, used when Loupe manages
# robots.txt. Defaults to the ua tokens (cut at the first "/"); set it where
# those differ, or norobots: true for tools that never read robots.txt.
# A category's robots tokens are added whenever the category is blocked —
# for opt-out tokens that aren't crawlers of their own (Google-Extended).

categories:
  - id: search
    name: Search engines
    about: Discover and index pages for traditional search results.
    default: allow
  - id: ai_search
    name: AI search
    about: Index content for AI-powered search and answer engines, with citations back to the source.
    default: allow
  - id: ai_assistant
    name: AI assistants
    about: Fetch a page live because a person asked an AI assistant or agent to read it.
    default: allow
  - id: ai_training
    name: AI training
    about: Crawl content to build datasets for training or fine-tuning AI models.
    default: block
    robots: [Google-Extended, Applebot-Extended]
  - id: preview
    name: Link previews
    about: Fetch a page's title and image when a link is shared in social apps and messengers.
    default: allow
  - id: seo
    name: SEO tools
    about: Crawl sites to analyse rankings, backlinks and technical SEO for marketing tools.
    default: allow
  - id: monitoring
    name: Monitoring & webhooks
    about: Check uptime and performance, verify ownership, or deliver webhooks.
    default: allow
  - id: feed
    name: Feed readers
    about: Poll RSS and Atom feeds for reader apps.
    default: allow
  - id: archiver
    name: Archivers
    about: Save snapshots of pages for historical preservation.
    default: allow
  - id: advertising
    name: Advertising
    about: Check landing pages and ad placements for ad networks.
    default: allow

